# Dream-Space 梦境空间 Docker 一键部署
# 用法（在项目根目录执行）：
#   docker compose -f deploy/docker-compose.yml up -d --build
# 首次使用请先改下面的密码/密钥，再执行上面的命令。

services:
  postgres:
    image: postgres:16-alpine
    container_name: dreamspace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dreamspace
      POSTGRES_PASSWORD: CHANGE_ME_DB_PASSWORD
      POSTGRES_DB: dreamspace
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dreamspace"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    container_name: dreamspace-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://dreamspace:CHANGE_ME_DB_PASSWORD@postgres:5432/dreamspace
      SECRET_KEY: CHANGE_ME_RANDOM_SECRET_KEY
      CORS_ORIGINS: http://localhost:3000,https://dream-space.vip
      # 阿里云 OSS（要用再填，不用可留空）
      OSS_ACCESS_KEY_ID: ""
      OSS_ACCESS_KEY_SECRET: ""
      OSS_BUCKET_NAME: ""
      OSS_ENDPOINT: ""
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"

  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    container_name: dreamspace-frontend
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: dreamspace-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.docker.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  pgdata:
