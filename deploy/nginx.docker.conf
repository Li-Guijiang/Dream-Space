# Docker 环境专用的 Nginx 配置（服务名通过 docker-compose 内部网络互通）
# 由 docker-compose.yml 自动挂载，无需手动修改

server {
    listen 80;
    server_name dream-space.vip www.dream-space.vip;

    # 前端页面 → frontend 容器 (3000)
    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 禁用代理缓存，避免重新打包后返回旧 HTML
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        proxy_cache off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 后端 API → backend 容器 (8000)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 上传文件 → backend 容器 (8000)
    location /uploads/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # 管理后台 → backend 容器 (8000)
    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
}
