# Dream-Space 梦境空间 Nginx 反向代理配置
# 用法：复制到宝塔面板「网站 → 站点 → 配置文件」，或服务器 /etc/nginx/sites-available/ 下
# 前端端口 3000，后端端口 8000

server {
    listen 80;
    server_name dream-space.vip www.dream-space.vip;

    # 前端页面 → Next.js (3000)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 关键：禁用 Nginx 代理缓存，否则重新打包后会返回旧 HTML（见 DEPLOY_NOTES.md）
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        proxy_cache off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";

        proxy_connect_timeout 30s;
        proxy_read_timeout 86400s;
        proxy_send_timeout 30s;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 后端 API → FastAPI (8000)
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 上传的图片等静态文件 → FastAPI (8000)
    location /uploads/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    # 管理后台 → FastAPI (8000，Vue 构建产物由后端挂载)
    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }
}

# 启用 HTTPS 后（宝塔面板申请 Let's Encrypt 证书），把上面的 listen 80 改为下面写法，
